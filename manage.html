<main id="login" class="login" hidden>
  <form id="loginForm" class="login-card" novalidate>
    <img src="logo-sq.png" alt="" class="login-logo">
    <h1>لوحة إدارة المركز</h1>
    <p class="muted" id="lHint">للحسابات الإدارية والمربيات المخوّلات فقط.</p>
    <div id="stCreds">
      <label class="fld"><span>رقم الهاتف أو البريد الإلكتروني</span><input id="email" type="text" inputmode="email" autocomplete="username" dir="ltr" maxlength="254" placeholder="05... / 06... / email@example.com"></label>
      <label class="fld"><span>كلمة المرور</span><input id="password" type="password" autocomplete="current-password" dir="ltr" maxlength="72"></label>
    </div>
    <div id="stMfa" hidden>
      <label class="fld"><span>رمز المصادقة الثنائية (6 أرقام)</span><input id="mfaCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" dir="ltr"></label>
    </div>
    <div id="stForgot" hidden>
      <label class="fld"><span>رقم الهاتف أو البريد الإلكتروني</span><input id="fEmail" type="text" inputmode="email" autocomplete="username" maxlength="254" dir="ltr"></label>
    </div>
    <div id="stInvite" hidden>
      <p class="hint">أدخل بريدك الإلكتروني أو رقم هاتفك لتفعيل حسابك وإنشاء كلمة المرور الخاصة بك مباشرة.</p>
      <label class="fld"><span>رقم الهاتف أو البريد الإلكتروني</span><input id="invEmail" type="text" inputmode="email" autocomplete="username" dir="ltr" maxlength="254" placeholder="06... / name@example.com"></label>
    </div>
    <div id="stSet" hidden>
      <label class="fld"><span id="lblSetEmail">اسم المستخدم (البريد أو رقم الهاتف)</span><input id="setEmail" type="text" autocomplete="username" dir="ltr" readonly class="fld-readonly"></label>
      <label class="fld"><span id="lblNp1">إنشاء كلمة المرور</span><input id="np1" type="password" autocomplete="new-password" dir="ltr" maxlength="72"><small class="hint" id="npHint">10 أحرف على الأقل مع حرف كبير وحرف صغير ورقم.</small></label>
      <label class="fld"><span id="lblNp2">تأكيد كلمة المرور</span><input id="np2" type="password" autocomplete="new-password" dir="ltr" maxlength="72"></label>
    </div>
    <p id="lErr" class="err" role="alert" hidden></p>
    <p id="lOk" class="okmsg" role="status" hidden></p>
    <button id="lBtn" class="btn block" type="submit">تسجيل الدخول</button>
    <button id="forgotBtn" class="linkbtn" type="button">نسيت كلمة المرور؟</button>
    <button id="backBtn" class="linkbtn" type="button" hidden>رجوع لتسجيل الدخول</button>
  </form>
</main>
