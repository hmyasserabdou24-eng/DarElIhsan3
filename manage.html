<body>

<symbol id="s-users" viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2M16 3.1a4 4 0 0 1 0 7.8M22 21v-2a4 4 0 0 0-3-3.9"/></symbol>

<symbol id="s-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></symbol>

<div id="boot" class="boot" role="status">جارٍ التحميل…</div>

<main id="login" class="login" hidden>
  <form id="loginForm" class="login-card" novalidate>
    <img src="logo-sq.png" alt="" class="login-logo">
    <h1>إدارة الأطفال والأولياء</h1>
    <p class="muted" id="lHint">للحسابات الإدارية المخوّلة فقط.</p>
    <div id="stCreds">
      <label class="fld"><span>البريد الإلكتروني</span><input id="email" type="email" inputmode="email" autocomplete="username" dir="ltr" maxlength="254"></label>
      <label class="fld"><span>كلمة المرور</span><input id="password" type="password" autocomplete="current-password" dir="ltr" maxlength="72"></label>
    </div>
    <div id="stMfa" hidden>
      <label class="fld"><span>رمز المصادقة الثنائية (6 أرقام)</span><input id="mfaCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" dir="ltr"></label>
    </div>
    <div id="stForgot1" hidden>
      <label class="fld"><span>البريد الإلكتروني للحساب</span><input id="fEmail" type="email" inputmode="email" autocomplete="username" maxlength="254" dir="ltr"></label>
    </div>
    <div id="stForgot2" hidden>
      <label class="fld"><span>الرمز الذي وصلك على البريد</span><input id="rCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10" dir="ltr"></label>
      <label class="fld"><span>كلمة المرور الجديدة</span><input id="rPass" type="password" autocomplete="new-password" dir="ltr" maxlength="72"></label>
      <label class="fld"><span>أعد كتابة كلمة المرور الجديدة</span><input id="rPass2" type="password" autocomplete="new-password" dir="ltr" maxlength="72"></label>
      <button id="resendBtn" class="linkbtn" type="button">إعادة إرسال الرمز</button>
    </div>
    <p id="lErr" class="err" role="alert" hidden></p>
    <p id="lOk" class="okmsg" role="status" hidden></p>
    <button id="lBtn" class="btn block" type="submit">دخول</button>
    <button id="forgotBtn" class="linkbtn" type="button">نسيت كلمة المرور؟</button>
    <button id="backBtn" class="linkbtn" type="button" hidden>رجوع لتسجيل الدخول</button>
  </form>
</main>

<div id="app" class="shell" hidden>
  <aside id="side" class="side" aria-label="القائمة الرئيسية">
    <div class="brand"><img src="logo-sq.png" alt=""><strong>دار الإحسان<br><span class="small">الإدارة</span></strong></div>
    <nav id="nav">
      <button type="button" data-sec="dash"><svg class="i"><use href="#s-home"/></svg>لوحة التحكم</button>
      <button type="button" data-sec="children"><svg class="i"><use href="#s-child"/></svg>الأطفال والطلبة</button>
      <button type="button" data-sec="branches"><svg class="i"><use href="#s-branch"/></svg>الفروع والأقسام</button>
      <button type="button" data-sec="programs"><svg class="i"><use href="#s-book"/></svg>البرامج التربوية</button>
      <button type="button" data-sec="reports"><svg class="i"><use href="#s-report"/></svg>التقارير التربوية</button>
      <button type="button" data-sec="appts"><svg class="i"><use href="#s-cal"/></svg>المواعيد والأنشطة</button>
      <button type="button" data-sec="msgs"><svg class="i"><use href="#s-mail"/></svg>الرسائل والإعلانات</button>
      <button type="button" data-sec="docs"><svg class="i"><use href="#s-file"/></svg>الوثائق</button>
      <div class="sep"></div>
      <button type="button" data-sec="accounts"><svg class="i"><use href="#s-shield"/></svg>حسابات الإدارة</button>
      <button type="button" data-sec="audit"><svg class="i"><use href="#s-log"/></svg>سجل العمليات</button>
      <button type="button" data-sec="settings"><svg class="i"><use href="#s-gear"/></svg>الأمان والإعدادات</button>
    </nav>
  </aside>
  <div id="scrim" class="scrim"></div>
  <div class="main">
    <header class="bar">
      <button id="menuBtn" class="icon-btn" type="button" aria-label="القائمة"><svg class="i"><use href="#s-menu"/></svg></button>
      <button id="collapseBtn" class="icon-btn desk-only" type="button" aria-label="طي القائمة الجانبية" aria-expanded="true" title="طي القائمة الجانبية"><svg class="i"><use href="#s-menu"/></svg></button>
      <div class="ttl"><strong id="secTitle">لوحة التحكم</strong><span id="who" class="chip">—</span></div>
      <button id="logoutBtn" class="icon-btn" type="button" aria-label="تسجيل الخروج"><svg class="i"><use href="#s-out"/></svg></button>
    </header>
    <main id="view" class="content" tabindex="-1"></main>
  </div>
</div>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true"><div id="modalCard" class="modal-card"></div></div>
<div id="printArea" aria-hidden="true"><img id="printImg" alt=""></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="cms-config.js?v=9"></script>
<script src="centers.js?v=1"></script>
<script src="de-core.js?v=11"></script>
<script src="xlsx-writer.js?v=1"></script>
<script src="qr-gen.js?v=9"></script>
<script src="qr-encoder.js?v=1"></script>
<script src="card.js?v=1"></script>
<script src="manage.js?v=13"></script>
</body>
</html>
